# Cloudflare Workers 配置（wrangler CLI 部署用）
# 如果用 Dashboard 粘贴部署，可忽略本文件，见 DEPLOY_CLOUDFLARE.md
name = "dylan-heartbeat"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV 存储：时间线 / 日记 / 配置 / 时间戳记忆库
# 创建方式：wrangler kv namespace create CONFIG
# 然后把输出里的 id 填到下面（id 是每个账号独有的，不能直接复制别人的）
[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 定时自动唤醒：每分钟触发一次（免费计划支持），代码内会自行判断是否需要真正唤醒
[triggers]
crons = ["* * * * *"]

# 非敏感配置可放这里；敏感配置（API Key 等）用 Cloudflare 面板的 Variables/Secrets 设置
# [vars]
# TIME_ZONE = "Asia/Shanghai"
# MODEL_NAME = "你的模型名称"
# WAKE_MIN_MINUTES = "2"
# WAKE_MAX_MINUTES = "180"
